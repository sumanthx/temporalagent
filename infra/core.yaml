AWSTemplateFormatVersion: '2010-09-09'
Description: SharePoint temporal agent durable AWS core
Parameters:
  ProjectName: {Type: String, Default: sharepoint-temporal-agent}
  ArtifactBucketName: {Type: String}
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  ChangeQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  TemporalFactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: document_id, AttributeType: S}
        - {AttributeName: valid_from, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: by-document-valid-time
          KeySchema:
            - {AttributeName: document_id, KeyType: HASH}
            - {AttributeName: valid_from, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  SourceStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  RuntimeRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration: {ScanOnPush: true}
      ImageTagMutability: MUTABLE
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: [bedrock-agentcore.amazonaws.com, lambda.amazonaws.com]}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TemporalAgentRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchWriteItem]
                Resource: [!GetAtt TemporalFactsTable.Arn, !Sub '${TemporalFactsTable.Arn}/index/*', !GetAtt SourceStateTable.Arn]
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ChangeQueue.Arn
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:Retrieve, bedrock:RetrieveAndGenerate]
                Resource: '*'
              - Effect: Allow
                Action: cognito-idp:DescribeUserPoolClient
                Resource: !GetAtt AgentUserPool.Arn
              - Effect: Allow
                Action: [neptune-graph:ReadDataViaQuery, neptune-graph:WriteDataViaQuery, neptune-graph:DeleteDataViaQuery]
                Resource: '*'
              - Effect: Allow
                Action: [s3vectors:GetVectors, s3vectors:PutVectors, s3vectors:QueryVectors]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt RuntimeRepository.Arn
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: KnowledgeBaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
              - Effect: Allow
                Action: [s3vectors:GetVectors, s3vectors:PutVectors, s3vectors:QueryVectors]
                Resource: '*'
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RuntimeImageBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${ArtifactBucket.Arn}/build/*'
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage]
                Resource: !GetAtt RuntimeRepository.Arn
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
  RuntimeBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-runtime'
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      Source:
        Type: S3
        Location: !Sub '${ArtifactBucket}/build/runtime.zip'
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_HOST
            build:
              commands:
                - docker build -f $DOCKERFILE -t $REPOSITORY_URI:$IMAGE_TAG .
            post_build:
              commands:
                - docker push $REPOSITORY_URI:$IMAGE_TAG
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !GetAtt RuntimeRepository.RepositoryUri
          - Name: REPOSITORY_HOST
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}'
          - Name: DOCKERFILE
            Value: Dockerfile.tools
          - Name: IMAGE_TAG
            Value: tools
      TimeoutInMinutes: 20
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  NeptuneImportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: neptune-graph.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadGraphImport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/neptune-import/*']
  AgentUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      DeletionProtection: ACTIVE
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UserPoolTags: {Project: !Ref ProjectName}
  AgentUserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref AgentUserPool
      Identifier: temporal-agent
      Name: Temporal Agent API
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke the temporal agent
  AgentMachineClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: AgentUserPoolResourceServer
    Properties:
      UserPoolId: !Ref AgentUserPool
      ClientName: !Sub '${ProjectName}-machine-client'
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthScopes: [temporal-agent/invoke]
      AccessTokenValidity: 60
      TokenValidityUnits: {AccessToken: minutes}
  AgentUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${AWS::AccountId}'
      UserPoolId: !Ref AgentUserPool
Outputs:
  ArtifactBucket: {Value: !Ref ArtifactBucket}
  ChangeQueueUrl: {Value: !Ref ChangeQueue}
  ChangeQueueArn: {Value: !GetAtt ChangeQueue.Arn}
  TemporalFactsTable: {Value: !Ref TemporalFactsTable}
  SourceStateTable: {Value: !Ref SourceStateTable}
  RuntimeRepositoryUri: {Value: !GetAtt RuntimeRepository.RepositoryUri}
  RuntimeRoleArn: {Value: !GetAtt RuntimeRole.Arn}
  KnowledgeBaseRoleArn: {Value: !GetAtt KnowledgeBaseRole.Arn}
  RuntimeBuildProject: {Value: !Ref RuntimeBuild}
  NeptuneImportRoleArn: {Value: !GetAtt NeptuneImportRole.Arn}
  AgentUserPoolId: {Value: !Ref AgentUserPool}
  AgentMachineClientId: {Value: !Ref AgentMachineClient}
  AgentIssuerUrl:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${AgentUserPool}'
  AgentTokenUrl:
    Value: !Sub 'https://${ProjectName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'
